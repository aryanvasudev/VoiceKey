name: CI

on:
  push:
    branches:
      - main
      - master
      - "feat/**"
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          echo "WHISPER_DONT_GENERATE_BINDINGS=1" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            librsvg2-dev

      - name: Set up MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure Windows LLVM / libclang
        if: runner.os == 'Windows'
        run: |
          if (Get-Command clang -ErrorAction SilentlyContinue) {
            $clangDir = Split-Path -Parent (Get-Command clang).Source
            echo "LIBCLANG_PATH=$clangDir" >> $env:GITHUB_ENV
            echo "$clangDir" >> $env:GITHUB_PATH
          } else {
            $llvmPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin"
            echo "LIBCLANG_PATH=$llvmPath" >> $env:GITHUB_ENV
            echo "$llvmPath" >> $env:GITHUB_PATH
          }
          # Strip MinGW and Strawberry Perl from PATH to prevent GNU headers leakage in bindgen
          $filteredPath = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'mingw|strawberry' }) -join ';'
          echo "PATH=$filteredPath" >> $env:GITHUB_ENV

          # Forward MSVC/Windows SDK include directories to bindgen via BINDGEN_EXTRA_CLANG_ARGS
          $extraArgs = ($env:INCLUDE -split ';' | Where-Object { $_ -ne '' } | ForEach-Object { "-I`"$_`"" }) -join ' '
          "BINDGEN_EXTRA_CLANG_ARGS=$extraArgs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify code formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Run Clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace --verbose

  android:
    name: Android FFI & AAR Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install Host Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Android Native Libraries and Bindings
        run: bash scripts/build_android_native.sh arm64-v8a x86_64

      - name: Package Android AAR
        run: bash scripts/package_android_aar.sh

      - name: Upload Android AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voicekey-core-aar
          path: target/voicekey-core.aar
