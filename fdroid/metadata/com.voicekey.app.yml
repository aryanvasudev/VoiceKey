Summary: 100% offline, private voice dictation keyboard powered by quantized Whisper.
Description: |-
  VoiceKey brings fast on-device voice dictation to Android using quantized GGML
  Whisper models. Audio capture, resampling, voice activity detection, and speech
  transcription run 100% locally on the device with zero cloud dependencies.

