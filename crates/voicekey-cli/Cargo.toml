[package]
name = "voicekey-cli"
version = "0.2.0"
edition = "2021"
description = "Standalone headless verification CLI for VoiceKey cross-platform engine"
authors = ["Aryan"]
license = "MIT"

[[bin]]
name = "voicekey-cli"
path = "src/main.rs"

[dependencies]
voicekey-core = { path = "../voicekey-core" }
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
indicatif = "0.17"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "6.0"

[dev-dependencies]
tempfile = "3.14"
