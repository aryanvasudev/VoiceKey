<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceKey Desktop</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent;
      color: #fff;
      user-select: none;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      background: rgba(25, 27, 34, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2ecc71;
    }
    .status-text {
      font-size: 14px;
      font-weight: 500;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="pill">
    <div class="dot" id="status-dot"></div>
    <span class="status-text" id="status-text">VoiceKey Ready</span>
  </div>
</body>
</html>
