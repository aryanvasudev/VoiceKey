[package]
name = "voicekey-android-ffi"
version = "0.2.0"
edition = "2021"
description = "UniFFI Android FFI bindings for VoiceKey core engine"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "voicekey_android_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["cli"]

[dependencies]
voicekey-core = { path = "../voicekey-core" }
uniffi = { version = "0.28" }
thiserror = "2.0"
tracing = "0.1"

[features]
default = []
cli = ["uniffi/cli"]

[dev-dependencies]
tempfile = "3.14"
