[package]
name = "voicekey-core"
version = "0.2.0"
edition = "2021"
description = "Core high-performance audio DSP, VAD, Whisper inference, and text processing engine for VoiceKey"
authors = ["Aryan"]
license = "MIT"

[dependencies]
rubato = "0.16"
whisper-rs = { version = "0.16", default-features = false }
thiserror = "2.0"
regex = "1.11"
tracing = "0.1"
cpal = "0.18"
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = "3.7"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
approx = "0.5"
tempfile = "3.14"

